<!DOCTYPE html>
<html>
<head>
    <title>Python Data Science & Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Python Data Science & Flask</h1>
    <p>Student Performance Dashboard</p>
    <a href="/analysis" class="button">View Data Science Analysis</a>
    <h2>Student Data</h2>
    <table>
        <tr><th>Name</th><th>Python</th><th>Data Science</th><th>Flask</th></tr>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.python }}</td>
            <td>{{ student.data_science }}</td>
            <td>{{ student.flask }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
